name: Reconcile missing 2026 WNBA gamebook PDFs
# Recover a whole season once after release; can be rerun manually if sources change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-wnba-2026.yml
      - wnba_monitor.py
      - repair_wnba_2026.py
permissions:
  contents: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ vars.ENABLE_HISTORICAL_BACKFILL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate verified official PDF discovery and archive-only changes
        run: |
          python -m unittest discover -s tests -p 'test_wnba_pdf_repair.py' -v
          python -m unittest discover -s tests -p 'test_wnba_archive_safety.py' -v
      - name: Verify and recover every missing completed 2026 WNBA PDF
        run: python repair_wnba_2026.py
      - name: Recalculate pending reports from actual archive
        run: python adaptive_monitor.py heartbeat WNBA
      - name: Reject any loss of historical games or official links
        run: python tests/archive_integrity_gate.py wnba/archive.json
      - name: Publish verified PDFs and review-only exception list
        run: |
          paths="wnba/archive.json wnba/report-review.json wnba/poll-status.json"
          if [[ -n "$(git status --porcelain $paths)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git diff --cached --check
            git commit -m "Recover verified WNBA PDFs; list remaining exceptions"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              python tests/archive_integrity_gate.py wnba/archive.json --baseline-ref origin/main
              sleep 2
            done
            exit 1
          fi
          echo "WNBA official PDF recovery found no new verified documents"
