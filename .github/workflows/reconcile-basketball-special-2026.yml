name: Recover missed 2026 NBA/WNBA All-Star and exhibition games
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-basketball-special-2026.yml
permissions:
  contents: write
jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nba-gamebooks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify independently sourced event IDs and archive safety
        run: python -m unittest discover -s tests -p 'test_basketball_special_2026.py' -v
      - name: Verify and archive four completed NBA All-Star games
        run: python reconcile_basketball_special_2026.py NBA
      - name: Reject any loss of archived games or saved PDFs
        run: python tests/archive_integrity_gate.py archive.json
      - name: Publish only verified special fixtures
        run: |
          if [[ -n "$(git status --porcelain archive.json nba-special-review.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive.json nba-special-review.json
            git diff --cached --check
            git commit -m "Archive four official 2026 NBA All-Star games"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              python tests/archive_integrity_gate.py archive.json --baseline-ref origin/main
            done
            exit 1
          fi
  wnba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wnba-gamebooks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify official IDs and archive-preserving special event classification
        run: python -m unittest discover -s tests -p 'test_basketball_special_2026.py' -v
      - name: Archive WNBA All-Star and three international exhibitions
        run: python reconcile_basketball_special_2026.py WNBA
      - name: Reject any loss of archived games or verified WNBA PDFs
        run: python tests/archive_integrity_gate.py wnba/archive.json
      - name: Publish only verified WNBA special fixtures
        run: |
          if [[ -n "$(git status --porcelain wnba/archive.json wnba/special-review.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/archive.json wnba/special-review.json
            git diff --cached --check
            git commit -m "Archive official 2026 WNBA All-Star and exhibitions"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              python tests/archive_integrity_gate.py wnba/archive.json --baseline-ref origin/main
            done
            exit 1
          fi
