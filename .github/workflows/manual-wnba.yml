name: Manual WNBA gamebook check (available while automatic checks are paused)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan WNBA reports
        run: python wnba_monitor.py
      - name: Update existing archive
        run: python wnba_archive.py
      - name: Retry recently missing official reports
        run: python recover_reports.py WNBA recent
      - name: Record successful scan
        run: python adaptive_monitor.py heartbeat WNBA
      - name: Check historical record and report safety
        run: python tests/archive_integrity_gate.py wnba/archive.json
      - name: Publish only changed data
        run: |
          if [[ -n "$(git status --porcelain wnba/gamebooks.json wnba/archive.json wnba/poll-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/gamebooks.json wnba/archive.json wnba/poll-status.json
            git commit -m "Manually update WNBA gamebook reports"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase -X theirs origin main
              python tests/archive_integrity_gate.py wnba/archive.json --baseline-ref FETCH_HEAD
            done
            exit 1
          fi
          echo "No WNBA reports changed"
