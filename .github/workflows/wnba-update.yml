name: Update WNBA Gamebook Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/New_York"
permissions:
  contents: write
  actions: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check league calendar and overdue-report demand
        id: demand
        run: |
          if python adaptive_monitor.py guard WNBA; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pause five-minute WNBA schedule on idle days
        if: steps.demand.outputs.active == 'false' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wnba-update.yml/disable"
      - if: steps.demand.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Check WNBA gamebooks
        if: steps.demand.outputs.active == 'true'
        run: python wnba_monitor.py
      - name: Update WNBA archive
        if: steps.demand.outputs.active == 'true'
        run: python wnba_archive.py
      - name: Recover reports that rolled out of the current game window
        if: steps.demand.outputs.active == 'true'
        run: python recover_reports.py WNBA recent
      - name: Record recent successful monitoring activity
        if: steps.demand.outputs.active == 'true'
        run: python adaptive_monitor.py heartbeat WNBA
      - name: Block loss of WNBA historical games or report links
        if: steps.demand.outputs.active == 'true'
        run: python tests/archive_integrity_gate.py wnba/archive.json
      - name: Publish WNBA data
        if: steps.demand.outputs.active == 'true'
        run: |
          if [[ -n "$(git status --porcelain wnba/gamebooks.json wnba/archive.json wnba/poll-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/gamebooks.json wnba/archive.json wnba/poll-status.json
            git commit -m "Update WNBA gamebook data"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              # Verify the result still contains every report from the newer remote.
              python tests/archive_integrity_gate.py wnba/archive.json --baseline-ref origin/main
              sleep 2
            done
            exit 1
          fi
      - name: Disable five-minute WNBA checks after the last missing report is found
        if: steps.demand.outputs.active == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python adaptive_monitor.py guard WNBA; then
            echo "Continue WNBA monitoring while a game or missing report needs attention"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wnba-update.yml/disable"
            echo "Disabled idle WNBA workflow"
          fi
