name: Update WNBA Gamebook Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "17,32,47,2 * * * *"
permissions:
  contents: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check WNBA gamebooks
        run: python wnba_monitor.py
      - name: Update WNBA archive
        run: python wnba_archive.py
      - name: Publish WNBA data
        run: |
          if [[ -n "$(git status --porcelain wnba/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/
            git commit -m "Update WNBA gamebook data"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
