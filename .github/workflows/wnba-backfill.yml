name: Backfill WNBA Historical Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "19,34,49,4 * * * *"
permissions:
  contents: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Retrieve WNBA historical records
        run: python wnba_backfill.py
      - name: Publish WNBA archive and progress
        run: |
          if [[ -n "$(git status --porcelain wnba/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/
            git commit -m "Backfill WNBA archive"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
