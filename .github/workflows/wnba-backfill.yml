name: Backfill WNBA Historical Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "19,34,49,4 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: wnba-gamebooks
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check WNBA calendar before historical completeness fetch
        id: demand
        run: |
          if python adaptive_monitor.py guard WNBA; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Disable unnecessary WNBA archive backfill
        if: steps.demand.outputs.active == 'false' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wnba-backfill.yml/disable"
      - if: steps.demand.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Retrieve WNBA historical records
        if: steps.demand.outputs.active == 'true'
        run: python wnba_backfill.py
      - name: Block loss of WNBA historical games or report links
        if: steps.demand.outputs.active == 'true'
        run: python tests/archive_integrity_gate.py wnba/archive.json
      - name: Publish WNBA archive and progress
        if: steps.demand.outputs.active == 'true'
        run: |
          if [[ -n "$(git status --porcelain wnba/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wnba/
            git commit -m "Backfill WNBA archive"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              # Verify the result still contains every report from the newer remote.
              python tests/archive_integrity_gate.py wnba/archive.json --baseline-ref origin/main
              sleep 2
            done
            exit 1
          fi
